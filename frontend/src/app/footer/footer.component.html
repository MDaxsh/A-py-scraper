<div class="d-flex justify-content-between align-items-center py-2 border-top">
  <div *ngIf="loading">Loading app info...</div>
  <div *ngIf="error" class="text-danger">{{ error }}</div>
  <div *ngIf="!loading && !error" class="d-flex gap-3 align-items-center">
    <small class="fw-bold">{{ appInfo.name }}</small>
    <small class="text-muted">v{{ appInfo.version }}</small>
    <span class="badge bg-light text-dark">{{ appInfo.status }}</span>
  </div>
</div>
